services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estimador-binance-web
    ports:
      - "8080:80"
    restart: unless-stopped

  extractor:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: estimador-binance-extractor
    env_file:
      - ./worker/.env
    restart: unless-stopped
